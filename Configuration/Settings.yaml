# Doc2Graph Pipeline & Model Configuration (Non-secret)
pipeline_mode: accurate
max_upload_mb: 50
window_size: 3
window_stride: 2
resolution_threshold: 0.65  # tuned by Tools/TrainEntityResolver.py on held-out documents
debug_pipeline: false
intermediate_graph_dir: Datasets/Processed

# Canonical Model & Whitelist Paths
relation_scorer_model_path: TrainedModels/RelationScorer.joblib
entity_resolver_model_path: TrainedModels/EntityResolver.joblib
relations_config_path: Configuration/RelationTypes.yaml

